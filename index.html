<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ответь, Кирилл, мудила</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Arial', sans-serif;
}

/* ===== ТЕМЫ ===== */
:root, [data-theme="light"] {
    --bg: #f8f9ff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --card: rgba(255, 255, 255, 0.7);
    --border: rgba(99, 102, 241, 0.2);
    --orb1: #a5b4fc;
    --orb2: #c4b5fd;
    --orb3: #fbcfe8;
    --danger: #ef4444;
    --gold: #f59e0b;
}

[data-theme="dark"] {
    --bg: #0a0a15;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --card: rgba(30, 30, 50, 0.6);
    --border: rgba(129, 140, 248, 0.3);
    --orb1: #4f46e5;
    --orb2: #7c3aed;
    --orb3: #db2777;
    --danger: #f87171;
    --gold: #fbbf24;
}

[data-theme="pink"] {
    --bg: #ffe0ef;
    --text: #4a0e2e;
    --text-muted: #a83f6d;
    --accent: #ff4fa3;
    --accent-2: #ff7bc4;
    --card: rgba(255, 255, 255, 0.8);
    --border: rgba(255, 79, 163, 0.35);
    --orb1: #ff9ecb;
    --orb2: #ff4fa3;
    --orb3: #ffd1e8;
    --danger: #ff3d7f;
    --gold: #ffb347;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    transition: background 0.5s ease, color 0.5s ease;
    position: relative;
    padding: 80px 0 40px;
}

/* ===== Переключатель тем ===== */
.theme-switcher {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 10px;
    z-index: 100;
    padding: 8px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border-radius: 50px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
}

.theme-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.theme-btn:hover {
    transform: scale(1.15) rotate(10deg);
    background: var(--border);
}

.theme-btn.active {
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent);
}

/* ===== Фоновые орбы ===== */
.bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 0.5s;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.7;
    animation: float 20s infinite ease-in-out;
    transition: transform 0.3s ease-out;
}

.orb1 { width: 500px; height: 500px; background: var(--orb1); top: -150px; left: -100px; }
.orb2 { width: 400px; height: 400px; background: var(--orb2); bottom: -100px; right: -100px; animation-delay: -7s; }
.orb3 { width: 350px; height: 350px; background: var(--orb3); top: 40%; left: 40%; animation-delay: -14s; }

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(60px, -40px) scale(1.1); }
    66% { transform: translate(-40px, 60px) scale(0.95); }
}

/* ===== ФОН ИЗ РОЗ ===== */
.roses-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
}

[data-theme="pink"] .roses-bg { opacity: 1; }
[data-theme="pink"] .bg-orbs { opacity: 0.25; }

.rose {
    position: absolute;
    font-size: 40px;
    animation: roseFall linear infinite;
    opacity: 0;
    filter: drop-shadow(0 4px 12px rgba(255, 79, 163, 0.4));
    will-change: transform, opacity;
}

@keyframes roseFall {
    0% { transform: translateY(-15vh) rotate(0deg) scale(0.6); opacity: 0; }
    10% { opacity: 0.85; }
    50% { transform: translateY(50vh) rotate(180deg) scale(1); opacity: 0.9; }
    90% { opacity: 0.7; }
    100% { transform: translateY(115vh) rotate(360deg) scale(0.7); opacity: 0; }
}

/* ===== Контейнер ===== */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px 24px;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
}

/* ===== Заголовок ===== */
.title {
    font-size: clamp(1.8rem, 6vw, 4.5rem);
    font-weight: 900;
    line-height: 1.1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.3em;
    margin-bottom: 16px;
    letter-spacing: -2px;
}

.title .word {
    display: inline-block;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: wordIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.title .word:nth-child(1) { animation-delay: 0.1s; }
.title .word:nth-child(2) { animation-delay: 0.25s; }
.title .word:nth-child(3) { animation-delay: 0.4s; }

.title .highlight {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
}

.title .highlight::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
    animation: underlineGrow 1s 0.8s ease-out backwards;
}

@keyframes wordIn {
    from { opacity: 0; transform: translateY(40px) rotate(-5deg); }
    to { opacity: 1; transform: translateY(0) rotate(0); }
}

@keyframes underlineGrow {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
}

.subtitle {
    color: var(--text-muted);
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    margin-bottom: 32px;
    animation: fadeIn 1s 0.6s backwards;
}

/* ===== Общие карточки ===== */
.card {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.15);
    transition: background 0.5s, border 0.5s;
}

/* ===== Секция ответов ===== */
.answer-section { margin-bottom: 20px; }

.magic-btn {
    position: relative;
    padding: 16px 42px;
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 10px 40px -10px var(--accent);
    margin-bottom: 20px;
}

.magic-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 20px 60px -10px var(--accent);
}

.magic-btn:active { transform: translateY(0) scale(0.98); }

.magic-btn .btn-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.5), transparent 40%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.magic-btn:hover .btn-glow { opacity: 1; }

.answer-box {
    padding: 20px 28px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#answerText {
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    font-weight: 600;
}

.answer-box.pop { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* ===== Генератор оскорблений ===== */
.insult-card {
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
}

.insult-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.6s;
    pointer-events: none;
}

.insult-card.flash::before { left: 100%; }

.section-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 700;
}

.insult-display {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(255,255,255,0.3);
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1px dashed var(--border);
    transition: all 0.3s;
}

[data-theme="dark"] .insult-display { background: rgba(255,255,255,0.05); }

#insultText {
    font-size: clamp(1.05rem, 2.6vw, 1.4rem);
    font-weight: 800;
    line-height: 1.4;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
}

.insult-display.shake { animation: shake 0.5s; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
}

.insult-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.insult-btn {
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 8px 24px -8px var(--accent);
}

.insult-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -8px var(--accent);
}

.insult-btn:active { transform: scale(0.96); }

.insult-btn.mega {
    background: linear-gradient(135deg, var(--danger), var(--gold));
    box-shadow: 0 8px 24px -8px var(--danger);
}

.insult-btn.copy {
    background: var(--text-muted);
    box-shadow: none;
}

/* ===== История ===== */
.history {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.history-item {
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 8px 12px;
    background: rgba(0,0,0,0.04);
    border-radius: 8px;
    text-align: left;
    animation: slideIn 0.3s ease-out;
    border-left: 3px solid var(--accent);
}

[data-theme="dark"] .history-item { background: rgba(255,255,255,0.05); }

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* ===== Статистика ===== */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.stat-item {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    transition: transform 0.2s;
}

.stat-item:hover { transform: translateY(-2px); }

.stat-value {
    font-size: 1.6rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
}

.stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 600;
}

/* ===== Достижения ===== */
.achievements {
    margin-bottom: 20px;
}

.ach-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.ach {
    font-size: 1.8rem;
    padding: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    filter: grayscale(1);
    opacity: 0.35;
    transition: all 0.4s;
    cursor: help;
    position: relative;
}

.ach.unlocked {
    filter: grayscale(0);
    opacity: 1;
    border-color: var(--gold);
    box-shadow: 0 0 20px -5px var(--gold);
    animation: achPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes achPop {
    0% { transform: scale(0.5) rotate(-20deg); }
    100% { transform: scale(1) rotate(0); }
}

.ach:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: -32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
}

/* ===== Уведомление о достижении ===== */
.toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, var(--gold), var(--accent));
    color: #fff;
    padding: 14px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 10px 40px -10px var(--gold);
    z-index: 200;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== Тряска экрана ===== */
@keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-4px, 2px) rotate(-0.3deg); }
    20%, 40%, 60%, 80% { transform: translate(4px, -2px) rotate(0.3deg); }
}

body.shake-screen { animation: screenShake 0.6s; }

/* ===== Частицы ===== */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
}

.particle {
    position: absolute;
    font-size: 20px;
    animation: particleFly 1.2s ease-out forwards;
    pointer-events: none;
}

@keyframes particleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot)); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== Адаптив ===== */
@media (max-width: 600px) {
    .theme-switcher { top: 12px; right: 12px; padding: 6px; gap: 6px; }
    .theme-btn { width: 38px; height: 38px; font-size: 18px; }
    .container { padding: 20px 16px; }
    .card { padding: 18px; }
}
</style>
</head>
<body>

<!-- Переключатель тем -->
<div class="theme-switcher">
    <button class="theme-btn" data-theme="light" title="Светлая">☀️</button>
    <button class="theme-btn" data-theme="dark" title="Тёмная">🌙</button>
    <button class="theme-btn" data-theme="pink" title="Кирилл">💖</button>
</div>

<!-- Фон -->
<div class="roses-bg" id="rosesBg"></div>
<div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<!-- Уведомление о достижении -->
<div class="toast" id="toast">🏆 <span id="toastText"></span></div>

<!-- Основной контент -->
<main class="container">
    <h1 class="title">
        <span class="word">Ответь</span>
        <span class="word highlight">Кирилл</span>
        <span class="word">мудила</span>
    </h1>

    <p class="subtitle">Генератор оскорблений, ответы и куча всего 👇</p>

    <!-- Статистика -->
    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-value" id="statClicks">0</span>
            <span class="stat-label">Кликов</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="statInsults">0</span>
            <span class="stat-label">Оскорблений</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="statAnswers">0</span>
            <span class="stat-label">Ответов</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="statAch">0/6</span>
            <span class="stat-label">Ачивки</span>
        </div>
    </div>

    <!-- Генератор оскорблений -->
    <div class="card insult-card" id="insultCard">
        <div class="section-title">🎲 Генератор оскорблений</div>
        <div class="insult-display" id="insultDisplay">
            <span id="insultText">Нажми кнопку 👇</span>
        </div>
        <div class="insult-buttons">
            <button class="insult-btn" id="genInsult">🎲 Сгенерировать</button>
            <button class="insult-btn mega" id="megaInsult">💥 МЕГА</button>
            <button class="insult-btn copy" id="copyInsult">📋 Копировать</button>
        </div>
        <div class="history" id="history"></div>
    </div>

    <!-- Секция ответов -->
    <div class="card answer-section">
        <div class="section-title">💬 Ответ Кириллу</div>
        <button class="magic-btn" id="magicBtn">
            <span class="btn-text">Ответить Кириллу</span>
            <span class="btn-glow"></span>
        </button>
        <div class="answer-box" id="answerBox">
            <p id="answerText">Кирилл, ты тут? 👀</p>
        </div>
    </div>

    <!-- Достижения -->
    <div class="card achievements">
        <div class="section-title">🏆 Достижения</div>
        <div class="ach-grid" id="achGrid"></div>
    </div>
</main>

<div class="particles" id="particles"></div>

<script>
// ===== Переключение тем =====
const themeBtns = document.querySelectorAll('.theme-btn');
const savedTheme = localStorage.getItem('theme') || 'light';

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
    localStorage.setItem('theme', theme);
    setTimeout(createRoses, 100);
}

applyTheme(savedTheme);

themeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        applyTheme(btn.dataset.theme);
        burst(window.innerWidth / 2, window.innerHeight / 2, '✨', 12);
    });
});

// ===== Розы =====
const rosesBg = document.getElementById('rosesBg');
const roseEmojis = ['🌹', '🌷', '🌸', '🌺', '💮', '🏵️'];

function createRoses() {
    rosesBg.innerHTML = '';
    if (document.documentElement.getAttribute('data-theme') !== 'pink') return;

    for (let i = 0; i < 30; i++) {
        const rose = document.createElement('div');
        rose.className = 'rose';
        rose.textContent = roseEmojis[Math.floor(Math.random() * roseEmojis.length)];
        rose.style.left = (Math.random() * 100) + 'vw';
        rose.style.fontSize = (24 + Math.random() * 44) + 'px';
        rose.style.animationDuration = (8 + Math.random() * 12) + 's';
        rose.style.animationDelay = (-Math.random() * 20) + 's';
        rosesBg.appendChild(rose);
    }
}
createRoses();

// ===== СИСТЕМА ДОСТИЖЕНИЙ =====
const ACHIEVEMENTS = {
    firstInsult: { icon: '🎯', name: 'Первый выстрел', tip: 'Сгенерируй первое оскорбление' },
    tenInsults:  { icon: '🔥', name: 'Разогрев', tip: '10 оскорблений' },
    fiftyInsults:{ icon: '💀', name: 'Машина оскорблений', tip: '50 оскорблений' },
    mega:        { icon: '💥', name: 'МЕГА-удар', tip: 'Используй мега-кнопку' },
    copyMaster:  { icon: '📋', name: 'Копировальщик', tip: 'Скопируй оскорбление' },
    answer5:     { icon: '💬', name: 'Диалог', tip: 'Получи 5 ответов' }
};

const achGrid = document.getElementById('achGrid');
const unlocked = JSON.parse(localStorage.getItem('unlockedAch') || '{}');

Object.entries(ACHIEVEMENTS).forEach(([key, a]) => {
    const el = document.createElement('div');
    el.className = 'ach' + (unlocked[key] ? ' unlocked' : '');
    el.textContent = a.icon;
    el.dataset.tip = a.tip;
    el.dataset.key = key;
    achGrid.appendChild(el);
});

function unlockAch(key) {
    if (unlocked[key]) return;
    unlocked[key] = true;
    localStorage.setItem('unlockedAch', JSON.stringify(unlocked));

    const el = document.querySelector(`.ach[data-key="${key}"]`);
    if (el) el.classList.add('unlocked');

    showToast(`🏆 Достижение: ${ACHIEVEMENTS[key].name}`);
    updateStats();
}

const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');
let toastTimer;

function showToast(text) {
    toastText.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

const stats = {

};

    document.getElementById('statClicks').textContent = stats.clicks;

    document.getElementById('statAnswers').textContent = stats.answers;

    localStorage.setItem('s_clicks', stats.clicks);
    localStorage.setItem('s_insults', stats.insults);
    localStorage.setItem('s_answers', stats.answers);

}

    'пессимист', 'скряга', 'жадина', 'грубиян', 'невежа'
];

const megaAdjectives = [
    'абсолютно', 'катастрофически', 'клинически', 'феноменально',
    'эпически', 'легендарно', 'исторически', 'космически',
    'вселенски', 'фантастически', 'тотально', 'беспросветно'
];

const endings = [
    '!', '!!', '!!!', ' 💀', ' 🤡', ' 🔥', ' 💩', ' 🌚', ' 🚮', ' ⚰️'
];

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateInsult(mega = false) {
    let text = '';
    if (mega) {
        text = `${randomItem(megaAdjectives)} ${randomItem(adjectives)} ${randomItem(nouns)}${randomItem(endings)}`;
    } else {
        text = `${randomItem(adjectives)} ${randomItem(nouns)}${randomItem(endings)}`;
    }
    // Заглавная первая буква
    return text.charAt(0).toUpperCase() + text.slice(1);
}

const insultText = document.getElementById('insultText');
const insultDisplay = document.getElementById('insultDisplay');
const insultCard = document.getElementById('insultCard');
const historyEl = document.getElementById('history');
const historyList = JSON.parse(localStorage.getItem('insultHistory') || '[]');

function renderHistory() {
    historyEl.innerHTML = historyList.slice(0, 5).map(h =>
        `<div class="history-item">${h}</div>`
    ).join('');
}
renderHistory();

function addToHistory(text) {
    historyList.unshift(text);
    if (historyList.length > 10) historyList.pop();
    localStorage.setItem('insultHistory', JSON.stringify(historyList));
    renderHistory();
}

function showInsult(text, mega = false) {
    insultText.textContent = text;
    insultDisplay.classList.remove('shake');
    void insultDisplay.offsetWidth;
    insultDisplay.classList.add('shake');

    insultCard.classList.remove('flash');
    void insultCard.offsetWidth;
    insultCard.classList.add('flash');

    addToHistory(text);

    stats.insults++;
    saveStats();

    if (stats.insults === 1) unlockAch('firstInsult');
    if (stats.insults === 10) unlockAch('tenInsults');
    if (stats.insults === 50) unlockAch('fiftyInsults');
    if (mega) unlockAch('mega');

    // Частицы
    const rect = insultDisplay.getBoundingClientRect();
    if (mega) {
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '💥', 30);
        document.body.classList.remove('shake-screen');
        void document.body.offsetWidth;
        document.body.classList.add('shake-screen');
    } else {
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '💢', 10);
    }
}

document.getElementById('genInsult').addEventListener('click', () => {
    showInsult(generateInsult(false));
    stats.clicks++;
    saveStats();
});

document.getElementById('megaInsult').addEventListener('click', () => {
    showInsult(generateInsult(true), true);
    stats.clicks++;
    saveStats();
});

document.getElementById('copyInsult').addEventListener('click', async () => {
    const text = insultText.textContent;
    if (text === 'Нажми кнопку 👇') {
        showToast('Сначала сгенерируй оскорбление!');
        return;
    }
    try {
        await navigator.clipboard.writeText(text);
        showToast('📋 Скопировано!');
        unlockAch('copyMaster');
    } catch {
        showToast('Не удалось скопировать');
    }
    stats.clicks++;
    saveStats();
});

// ===== ВЗРЫВ ЧАСТИЦ =====
function burst(x, y, fixedEmoji = null, amount = 20) {
    const particlesContainer = document.getElementById('particles');

    for (let i = 0; i < amount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = fixedEmoji || emojis[Math.floor(Math.random() * emojis.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 200;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        const rot = (Math.random() - 0.5) * 720;

        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.setProperty('--rot', rot + 'deg');

        particlesContainer.appendChild(p);
        setTimeout(() => p.remove(), 1300);
    }
}

// ===== ПАРАЛЛАКС =====
const orbs = document.querySelectorAll('.orb');
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;
    orbs.forEach((orb, i) => {
        const speed = (i + 1) * 15;
        orb.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
    });
});

// ===== КЛИК В ЛЮБОМ МЕСТЕ =====
document.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    burst(e.clientX, e.clientY, null, 6);
});
